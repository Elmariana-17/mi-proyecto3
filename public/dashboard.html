<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta</title>
<style>
  :root{--bg:#f2f3f1;--panel:#fff;--line:#e2e4e1;--ink:#2b3430;--ink-dim:#6b7570;--green:#4c9a7f;--green-dark:#3d8068;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:24px;background:var(--bg);color:var(--ink);}
  .top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto 18px;}
  h2{font-size:18px;margin:0;}
  .tabla{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow-x:auto;max-width:900px;margin:0 auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  button{padding:9px 16px;border:0;border-radius:5px;background:var(--green);color:#fff;cursor:pointer;font-weight:600;}
  button:hover{background:var(--green-dark);}
</style>
</head>
<body>
  <div class="top">
    <div>
      <h2>Tu actividad reciente</h2>
      <small id="quien" style="color:var(--ink-dim);"></small>
    </div>
    <button id="logout">Cerrar sesión</button>
  </div>
  <div class="tabla">
    <table id="logins">
      <thead><tr><th>Fecha</th><th>Lugar</th><th>IP</th><th>Dispositivo</th><th>Resultado</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function cargar() {
      const [r, me] = await Promise.all([fetch('/api/logins'), fetch('/api/me')]);
      if (r.status === 401) return (location.href = '/login.html');
      const user = await me.json();
      document.getElementById('quien').textContent = 'Sesión: ' + user.email;

      const tbody = document.querySelector('#logins tbody');
      for (const e of await r.json()) {
        const tr = document.createElement('tr');
        const celdas = [
          new Date(e.created_at).toLocaleString('es-MX'),
          [e.city, e.country].filter(Boolean).join(', ') || 'Desconocido',
          e.ip_address,
          [e.browser, e.os].filter(Boolean).join(' en ') || '—',
          e.success ? 'Exitoso' : 'Fallido'
        ];
        for (const t of celdas) {
          const td = document.createElement('td');
          td.textContent = t;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }
    document.getElementById('logout').onclick = async () => {
      await fetch('/api/logout', { method: 'POST' });
      location.href = '/login.html';
    };
    cargar();
  </script>
</body>
</html>
